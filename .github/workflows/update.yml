
name: Haven Player Counter

on:
  schedule:
    - cron: "2-59/5 * * * *"

  workflow_dispatch:

concurrency:
  group: haven-player-counter
  cancel-in-progress: true

jobs:
  update-player-count:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests mcstatus

      - name: Update Discord
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: python update.py
